<div class="container">
  <div class="row py-4">
    <div class="col-2 text-center">
      <div class="menu-card" (click)="changePath(-1)">My storage unit</div>
    </div>
    @if (path.length > 0) {
      <div class="col-10">
        <div class="row">
          @for (item of path; track item; let i = $index) {
            <div class="col-3">
              <div class="row">
                <div class="col-3 text-center separator">
                  {{ ">" }}
                </div>
                <div class="col-9 text-center">
                  <div class="menu-card" (click)="changePath(i)">{{ item }}</div>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
